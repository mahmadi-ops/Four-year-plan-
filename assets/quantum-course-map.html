<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantum Course Connections</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: a 1920×1080 stage with the proposed course as a hub; required prerequisites on the left, the information-side tools above, the computation-side tools to the right, error correction and downstream below. Single dark theme to match the MATH 14 brain map. */
:root { --bg: #16130f; --fg: #f3f2f2; --fg-55: rgba(243,242,242,0.55); --fg-75: rgba(243,242,242,0.75); --line: rgba(243,242,242,0.38); --gold: #b68235; --gold-hi: #cf9f55; --qc: #4fd1c0; --qc-dim: rgba(79,209,192,0.75); --cs: #6fb3f2; --font-display: "Cormorant Garamond", Georgia, serif; --font-body: "Lora", Georgia, serif; color-scheme: dark; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
#wrap { overflow: hidden; width: 100%; }
#stage { position: relative; width: 1920px; height: 1080px; background: var(--bg); color: var(--fg); font-family: var(--font-body); overflow: hidden; transform-origin: 0 0; }
#connectors { position: absolute; inset: 0; pointer-events: none; }
#connectors path { transition: stroke 0.15s, stroke-width 0.15s, opacity 0.15s; stroke: var(--qc-dim); }
#connectors path.dash { stroke-dasharray: 7 5; }
#connectors.focus path { opacity: 0.1; }
#connectors.focus path.hi { opacity: 1; stroke-width: 2.6; stroke: var(--qc); }
.node { position: absolute; box-sizing: border-box; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 12px 16px; color: var(--fg); display: block; transition: border-color 0.15s, opacity 0.15s; }
.node.cs { border-color: rgba(111,179,242,0.6); }
.node.cs .kick { color: var(--cs); }
.node.qc { border: 1.5px solid var(--qc); box-shadow: 0 0 0 4px rgba(79,209,192,0.12); padding: 18px 22px; }
.node.qc .kick, .node.qc .hub { color: var(--qc); }
.node:hover, .node.hi { border-color: var(--qc); }
#stage.focus .node { opacity: 0.28; }
#stage.focus .node.hi, #stage.focus .node:hover { opacity: 1; }
#stage.focus .colhead { opacity: 0.28; }
.node .kick { font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-55); }
.node .t { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.12; margin-top: 2px; text-wrap: balance; }
.node .hub { font-family: var(--font-display); font-weight: 500; font-size: 34px; text-align: center; line-height: 1.1; text-wrap: balance; }
.node .meta { margin-top: 6px; font-size: 13.5px; line-height: 1.35; color: var(--fg-55); }
.node .meta.c { text-align: center; }
.rule { width: 70px; height: 1px; background: var(--qc); margin: 10px auto 0; }
.colhead { position: absolute; font-size: 13.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--qc); transition: opacity 0.15s; white-space: nowrap; }
.colhead span { color: var(--fg-55); letter-spacing: 0.04em; text-transform: none; font-style: italic; }
.title { position: absolute; left: 60px; top: 44px; }
.title .h { font-family: var(--font-display); font-weight: 400; font-size: 38px; line-height: 1; white-space: nowrap; }
.title .k { margin-top: 8px; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--qc); }
#legend { position: absolute; left: 60px; top: 110px; width: 300px; font-size: 14px; color: var(--fg-75); line-height: 1.45; }
#legend .row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
#legend svg { flex: none; }
#legend .box { flex: none; width: 36px; height: 14px; border: 1px solid var(--line); border-radius: 3px; box-sizing: border-box; }
#legend .hint { margin-top: 10px; font-style: italic; color: var(--fg-55); }
@media (prefers-reduced-motion: reduce) { #connectors path, .node, .colhead { transition: none; } }
</style>
</head>
<body>

<div id="wrap"><div id="stage">
  <svg id="connectors" width="1920" height="1080">
    <defs>
      <marker id="arr-qc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(79,209,192,0.9)"/></marker>
    </defs>
  </svg>
  <div class="title"><div class="h">What a quantum course needs from mathematics and computer science</div></div>
  <div id="legend">
    <div class="row"><svg width="44" height="10"><line x1="0" y1="5" x2="36" y2="5" stroke="rgba(79,209,192,0.8)" stroke-width="1.5"/><path d="M36,1 L44,5 L36,9 z" fill="rgba(79,209,192,0.9)"/></svg><span>required prerequisite</span></div>
    <div class="row"><svg width="44" height="10"><line x1="0" y1="5" x2="36" y2="5" stroke="rgba(79,209,192,0.8)" stroke-width="1.5" stroke-dasharray="6 4"/><path d="M36,1 L44,5 L36,9 z" fill="rgba(79,209,192,0.9)"/></svg><span>a course whose tools it draws on (into it) or that it informs (out of it)</span></div>
    <div class="row"><span class="box" style="border-color:rgba(111,179,242,0.6)"></span><span>computer science course</span></div>
  </div>
</div></div>

<script>
(function(){
const HEADS = [
  [520, 180, 'Quantum information draws on', 'analysis · operator theory · convexity · statistics'],
  [120, 440, 'Required prerequisites', ''],
  [1380, 335, 'Quantum computation draws on', 'algebra · number theory · combinatorics · cryptography · complexity · algorithms', 520],
  [520, 840, 'Error correction draws on', 'topology'],
  [1100, 840, 'Informs', ''],
];
const W = 250;
const NODES = [
  { id:'qic', x:720, y:500, w:380, qc:true, kick:'MATH 1XX', hub:'Quantum Information & Computation', rule:true, meta:'Prereq: 52, 53, 122 · CSCI 10 recommended' },
  // required
  { id:'52',  x:120, y:480, w:240, kick:'MATH 52',  t:'Intro to Abstract Algebra', meta:'Prereq: 51' },
  { id:'53',  x:120, y:600, w:240, kick:'MATH 53',  t:'Linear Algebra', meta:'Prereq: 13' },
  { id:'122', x:120, y:720, w:240, kick:'MATH 122', t:'Probability & Statistics I', meta:'Pre/co-req: 14' },
  // information side
  { id:'102', x:520,  y:215, w:W, kick:'MATH 102', t:'Advanced Calculus', meta:'Prereq: 14, 53' },
  { id:'103', x:800,  y:215, w:W, kick:'MATH 103', t:'Advanced Linear Algebra', meta:'Prereq: 53' },
  { id:'146', x:1080, y:215, w:W, kick:'MATH 146', t:'Optimization I', meta:'Prereq: CSCI 10, 14, 53' },
  { id:'123', x:1360, y:215, w:W, kick:'MATH 123', t:'Probability & Statistics II', meta:'Prereq: 122' },
  // computation side, math
  { id:'111', x:1380, y:395, w:W, kick:'MATH 111', t:'Abstract Algebra I', meta:'Prereq: 52, 53', alt:true },
  { id:'175', x:1380, y:510, w:W, kick:'MATH 175', t:'Theory of Numbers', meta:'Prereq: 52', alt:true },
  { id:'176', x:1380, y:625, w:W, kick:'MATH 176', t:'Combinatorics', meta:'Prereq: 51' },
  { id:'178', x:1380, y:740, w:W, kick:'MATH 178', t:'Cryptography', meta:'Prereq: 51' },
  // computation side, CS
  { id:'c161', x:1660, y:455, w:W, cs:true, kick:'CSCI 161', t:'Automata & Languages', meta:'Prereq: MATH 51' },
  { id:'c162', x:1660, y:570, w:W, cs:true, kick:'CSCI 162', t:'Computational Complexity', meta:'Prereq: MATH 51', alt:true },
  { id:'c163', x:1660, y:685, w:W, cs:true, kick:'CSCI 163', t:'Theory of Algorithms', meta:'Prereq: MATH 51, CSCI 61' },
  // below
  { id:'113',  x:520,  y:880, w:W, kick:'MATH 113', t:'Topology', meta:'Prereq: 14, 51', alt:true },
  { id:'c181', x:1100, y:880, w:W, cs:true, kick:'CSCI 181', t:'Applied Cryptography', meta:'Prereq: MATH 178, CSCI 62' },
];
const EDGES = [ ['52','qic'], ['53','qic'], ['122','qic'] ];
const RELATED = [
  ['102','qic'], ['103','qic'], ['146','qic'], ['123','qic'],
  ['111','qic'], ['175','qic'], ['176','qic'], ['178','qic'], ['c161','qic'], ['c162','qic'], ['c163','qic'],
  ['113','qic'],
  ['qic','c181'],
];

const stage = document.getElementById('stage');
for (const [x, y, h, s, wd] of HEADS) {
  const d = document.createElement('div'); d.className = 'colhead'; d.style.left = x + 'px'; d.style.top = y + 'px';
  if (wd) { d.style.width = wd + 'px'; d.style.whiteSpace = 'normal'; d.style.lineHeight = '1.5'; }
  d.textContent = h; if (s) { const sp = document.createElement('span'); sp.textContent = (h ? ' · ' : '') + s; d.appendChild(sp); }
  stage.appendChild(d);
}
for (const n of NODES) {
  const el = document.createElement('div');
  el.className = 'node' + (n.cs ? ' cs' : '') + (n.qc ? ' qc' : '');
  el.dataset.node = n.id;
  el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; el.style.width = n.w + 'px';
  if (n.kick) { const k = document.createElement('div'); k.className = 'kick'; if (n.qc) k.style.textAlign = 'center'; k.textContent = n.kick; el.appendChild(k); }
  if (n.hub) { const h = document.createElement('div'); h.className = 'hub'; h.textContent = n.hub; el.appendChild(h); if (n.rule) { const r = document.createElement('div'); r.className = 'rule'; el.appendChild(r); } }
  if (n.t) { const t = document.createElement('div'); t.className = 't'; t.textContent = n.t; el.appendChild(t); }
  if (n.meta) { const m = document.createElement('div'); m.className = 'meta' + (n.qc ? ' c' : ''); m.textContent = n.meta; el.appendChild(m); }
  stage.appendChild(el);
}
const svg = document.getElementById('connectors');
const touching = {};
const q = id => stage.querySelector('[data-node="' + id + '"]');
function draw() {
  while (svg.lastChild && svg.lastChild.tagName !== 'defs') svg.removeChild(svg.lastChild);
  for (const k in touching) delete touching[k];
  const all = EDGES.map(e => [e[0], e[1], false]).concat(RELATED.map(e => [e[0], e[1], true]));
  for (const [a, b, dashed] of all) {
    const rectOf = id => { const el = q(id); return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight }; };
    const A = rectOf(a), B = rectOf(b);
    const acx = A.x + A.w / 2, acy = A.y + A.h / 2, bcx = B.x + B.w / 2, bcy = B.y + B.h / 2;
    let d;
    if (Math.abs(bcx - acx) > Math.abs(bcy - acy)) {
      const p1 = bcx > acx ? [A.x + A.w, acy] : [A.x, acy];
      const p2 = bcx > acx ? [B.x, bcy] : [B.x + B.w, bcy];
      const k = (p2[0] - p1[0]) * 0.45;
      d = `M${p1[0]},${p1[1]} C${p1[0] + k},${p1[1]} ${p2[0] - k},${p2[1]} ${p2[0]},${p2[1]}`;
    } else {
      const p1 = bcy > acy ? [acx, A.y + A.h] : [acx, A.y];
      const p2 = bcy > acy ? [bcx, B.y] : [bcx, B.y + B.h];
      const k = (p2[1] - p1[1]) * 0.45;
      d = `M${p1[0]},${p1[1]} C${p1[0]},${p1[1] + k} ${p2[0]},${p2[1] - k} ${p2[0]},${p2[1]}`;
    }
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d); p.setAttribute('fill', 'none');
    p.setAttribute('class', dashed ? 'dash' : '');
    p.setAttribute('stroke-width', '1.5');
    p.setAttribute('marker-end', 'url(#arr-qc)');
    svg.appendChild(p);
    for (const id of [a, b]) {
      (touching[id] = touching[id] || { paths: [], nodes: [] });
      touching[id].paths.push(p);
      touching[id].nodes.push(id === a ? b : a);
    }
  }
}
draw();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
for (const n of NODES) {
  const el = q(n.id);
  const focus = on => {
    const inc = touching[n.id]; if (!inc) return;
    svg.classList.toggle('focus', on); stage.classList.toggle('focus', on);
    for (const p of inc.paths) p.classList.toggle('hi', on);
    for (const id of inc.nodes) { const t = q(id); if (t) t.classList.toggle('hi', on); }
  };
  el.addEventListener('mouseenter', () => focus(true));
  el.addEventListener('mouseleave', () => focus(false));
}
function fit() {
  const w = document.documentElement.clientWidth;
  const s = w / 1920;
  stage.style.transform = 'scale(' + s + ')';
  document.getElementById('wrap').style.height = (1080 * s) + 'px';
}
fit(); window.addEventListener('resize', fit);
})();
</script>
</body>
</html>
